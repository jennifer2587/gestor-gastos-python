<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos por categoria</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>
       
    <div class="contenedor">

    <h1>📊 gastos por categoria</h1>


    <form method="POST"> 

        <label>Buscarn categoria:</label>

        <input 
        type="text"
        name="categoria"
        placeholder="Ej: comida">


        <button class="boton" type="submit">
          🔎 Buscar  
        </button>

     
    </form>

    <br>

    <table>


        <tr>
            <th>Categoria</th>
            <th>Descripcion</th>
            <th>Fecha</th>
        </tr>


        {% for g in gastos %}

        <tr>

            <td>{{ g.categoria }}</td>

            <td>{{ g.descripcion }}</td>

            <td>{{ g.valor}}</td>

            <td>{{ g.fecha }}</td>



        </tr>

        {% endfor %}
    </table>

    <br>

    <a class="boton" href="{{ url_for('index') }}">
    🏠 Inicio
     </a>

    </div>




</body>
</html>
