<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar gastos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

 
</head>
<body>

    <div class="contenedor">

        <h1>Modificar  gasto 📝</h1>

        <form action="" method="POST">

            <label>Descripcion:</label>

            <input
             type="text"
             name="descripcion"
             value="{{ gasto.descripcion }}">


             <label>Valor:</label>

             <input 
              type="number"
              name="valor"
              value="{{ gasto.valor }}">


              <label>Categoria:</label>
              <input
               type="text"
               name="categoria"
               value="{{ gasto.categoria }}">


               <button class="boton"  type="submit">
                 💾 Guardar cambios
               </button>


        </form>
         


        <a class= "boton" href="{{ url_for('gastos')}}">
            📋 Volver gastos 
        </a>




        <a class="boton" href="{{ url_for('index')}}">
            🏠 Inicio
        </a>


    </div>
    
</body>
</html>
